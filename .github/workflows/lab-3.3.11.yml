name: "Лаб. 3.3.11: Контроль версий Git"

# Работа отправляет коммиты в отдельный репозиторий medivhkr/devasc-study-team.
# Повторный запуск возможен только вручную и только после очистки этого репозитория,
# иначе git push будет отклонён (история на GitHub уже содержит коммиты из первого прогона).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    uses: ./.github/workflows/_run-lab.yml
    secrets: inherit
    with:
      lab: 05-3.3.11-git-version-control
      env: container
