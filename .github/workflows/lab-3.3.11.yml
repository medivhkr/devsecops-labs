name: "Лаб. 3.3.11: Контроль версий Git"

on:
  push:
    branches: [main]
    paths:
      - "labs/05-3.3.11-git-version-control/scenario.yml"
      - "labs/05-3.3.11-git-version-control/prepare.sh"
      - "labs/05-3.3.11-git-version-control/src/**"
      - "tools/labrun/**"
      - "tools/csr1kv_emulator/**"
      - "lab-env/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    uses: ./.github/workflows/_run-lab.yml
    secrets: inherit
    with:
      lab: 05-3.3.11-git-version-control
      env: container
