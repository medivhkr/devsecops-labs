name: "Лаб. 3.1.12: Инструменты разработки Python"

on:
  push:
    branches: [main]
    paths:
      - "labs/04-3.1.12-python-dev-tools/scenario.yml"
      - "labs/04-3.1.12-python-dev-tools/prepare.sh"
      - "labs/04-3.1.12-python-dev-tools/src/**"
      - "tools/labrun/**"
      - "tools/csr1kv_emulator/**"
      - "lab-env/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    uses: ./.github/workflows/_run-lab.yml
    secrets: inherit
    with:
      lab: 04-3.1.12-python-dev-tools
      env: container
