# Example-Server (www.example.com): веб-сервер nginx. В Packet Tracer: Services > HTTP, HTTP On, HTTPS Off
user www-data;
worker_processes 1;
pid /run/nginx-Example-Server.pid;
error_log /var/log/pt-lab/nginx-Example-Server.error.log;
events {
    worker_connections 64;
}
http {
    include /etc/nginx/mime.types;
    access_log /var/log/pt-lab/nginx-Example-Server.access.log;
    server {
        listen 64.100.0.10:80;
        server_name www.example.com;
        root /srv/labnet/Example-Server/www;
        index index.html;
    }
}
