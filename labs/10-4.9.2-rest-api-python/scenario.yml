  # ---------- DevSecOps: итоговая проверка обращения с ключом ----------
  - id: rm_saved_json
    title: "DevSecOps: удаление сохранённых ответов API (в ссылках mapUrl есть ключ)"
    cmd: "rm -f /tmp/route.json /tmp/err.json"
  - id: ls_final
    title: "Итог: файлы mapquest_parse-json_1.py ... mapquest_parse-json_7.py"
    cmd: "ls -l"
  - id: grep_key_handling
    title: "DevSecOps: ключ читается из окружения и маскируется при выводе во всех версиях"
    cmd: 'grep -nF -e "key = " -e "key=***" mapquest_parse-json_*.py'
  # Служебная проверка от root (в протокол не попадает, результат в steps.json): значения ключа
  # нет в сыром потоке терминала out/<lab>/raw.log, из которого строится transcript.txt.
  - id: key_leak_check
    title: "DevSecOps: служебная проверка, что значения ключа нет в raw.log"
    host: |
      [ -f /home/devasc/.mapquest_env ] || { echo "no key file, check skipped"; exit 0; }
      . /home/devasc/.mapquest_env
      [ -n "$MAPQUEST_KEY" ] || { echo "empty key, check skipped"; exit 0; }
      for f in out/*/raw.log; do
        [ -f "$f" ] || continue
        if grep -qF -- "$MAPQUEST_KEY" "$f"; then echo "MAPQUEST_KEY FOUND in $f"; exit 1; fi
        echo "MAPQUEST_KEY not found in $f"
      done
    timeout: 60
