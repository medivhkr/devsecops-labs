lab: "7.4.7"
title: "Use Ansible to Back Up and Configure a Device"
shell_init:
  - "export ANSIBLE_FORCE_COLOR=0 ANSIBLE_NOCOLOR=1"
collect:
  - ~/labs/devnet-src/ansible/ansible-csr1000v
  - /tmp/csr1kv.log
steps:
  # ---------- Part 2: Configure Ansible ----------
  - id: cd_lab
    title: "Переход в каталог ansible-csr1000v"
    cmd: "cd labs/devnet-src/ansible/ansible-csr1000v"
  - id: hosts
    title: "Part 2 Step 2: inventory-файл hosts"
    write_file:
      path: ~/labs/devnet-src/ansible/ansible-csr1000v/hosts
      content: |
        # Enter the hosts or devices for Ansible playbooks
        CSR1kv ansible_user=cisco ansible_password=cisco123! ansible_host=192.168.56.101
  - id: cd_up
    title: "Part 2 Step 3a: на уровень выше"
    cmd: "cd .."
  - id: ansible_usage
    title: "Part 2 Step 3b: справка ansible"
    cmd: "ansible"
  - id: ansible_version_global
    title: "Part 2 Step 3c: версия Ansible и файл конфигурации по умолчанию"
    cmd: "ansible --version"
  - id: default_cfg
    title: "Part 2 Step 4: файл /etc/ansible/ansible.cfg"
    cmd: "cat /etc/ansible/ansible.cfg | more"
    interact:
      - expect: "--More--"
        send: "q"
        raw: true
  - id: cd_csr
    title: "Part 2 Step 5a"
    cmd: "cd ansible-csr1000v/"
  - id: ansible_version_local
    title: "Part 2 Step 5a: ansible --version в каталоге лабораторной"
    cmd: "ansible --version"
  - id: cat_cfg_placeholder
    title: "Part 2 Step 5b: содержимое ansible.cfg до правки"
    cmd: "cat ansible.cfg"
  - id: ansible_cfg
    title: "Part 2 Step 6: ansible.cfg"
    write_file:
      path: ~/labs/devnet-src/ansible/ansible-csr1000v/ansible.cfg
      content: |
        # config file for ansible-csr1000v
        [defaults]
        # Use local hosts file in this folder
        inventory=./hosts
        host_key_checking = False # Don't worry about RSA Fingerprints
        retry_files_enabled = False # Do not create them
        deprecation_warnings = False # Do not show warnings
  - id: cat_cfg
    title: "Part 2 Step 7: итоговые файлы конфигурации"
    cmd: "cat ansible.cfg hosts"

  # ---------- Part 3: Back up a configuration ----------
  - id: backup_playbook
    title: "Part 3 Step 1: плейбук резервного копирования"
    write_file:
      path: ~/labs/devnet-src/ansible/ansible-csr1000v/backup_cisco_router_playbook.yaml
      content: |
        ---
        - name: AUTOMATIC BACKUP OF RUNNING-CONFIG
          hosts: CSR1kv
          gather_facts: false
          connection: local
          tasks:
           - name: DISPLAYING THE RUNNING-CONFIG
             ios_command:
               commands:
                 - show running-config
             register: config
           - name: SAVE OUTPUT TO ./backups/
             copy:
               content: "{{ config.stdout[0] }}"
               dest: "backups/show_run_{{ inventory_hostname }}.txt"
  - id: ping1
    title: "Part 3 Step 3a: проверка доступности CSR1kv"
    cmd: "ping 192.168.56.101"
    interact:
      - expect: "icmp_seq=2 "
        delay: 0.3
        sendcontrol: "c"
  - id: mkdir_backups
    title: "Part 3 Step 3b"
    cmd: "mkdir backups"
  - id: run_backup
    title: "Part 3 Step 3c: запуск плейбука резервного копирования"
    cmd: "ansible-playbook backup_cisco_router_playbook.yaml"
    timeout: 300
  - id: ls_backups
    title: "Part 3 Step 4: проверка файла резервной копии"
    cmd: "ls -l backups"
  - id: cat_backup
    title: "Part 3 Step 4: содержимое резервной копии"
    cmd: "cat backups/show_run_CSR1kv.txt"

  # ---------- Part 4: Configure a device ----------
  - id: cat_hosts
    title: "Part 4 Step 1: inventory"
    cmd: "cat hosts"
  - id: ipv6_playbook
    title: "Part 4 Step 2: плейбук настройки IPv6"
    write_file:
      path: ~/labs/devnet-src/ansible/ansible-csr1000v/cisco_router_ipv6_config_playbook.yaml
      content: |
        ---
        - name: CONFIGURE IPv6 ADDRESSING
          hosts: CSR1kv
          gather_facts: false
          connection: local
          tasks:
           - name: SET IPv6 ADDRESS
             ios_config:
               parents: "interface GigabitEthernet1"
               lines:
                 - description IPv6 ADDRESS
                 - ipv6 address 2001:DB8:ACAD:1::1/64
                 - ipv6 address FE80::1:1 link-local
           - name: SHOW IPv6 INTERFACE BRIEF
             ios_command:
               commands:
                 - show ipv6 interface brief
             register: output
           - name: SAVE OUTPUT ./ios_configurations/
             copy:
               content: "{{ output.stdout[0] }}"
               dest: "ios_configurations/IPv6_output_{{ inventory_hostname }}.txt"
  - id: ping2
    title: "Part 4 Step 4a: проверка доступности CSR1kv"
    cmd: "ping 192.168.56.101"
    interact:
      - expect: "icmp_seq=2 "
        delay: 0.3
        sendcontrol: "c"
  - id: mkdir_iosconf
    title: "Part 4 Step 4b"
    cmd: "mkdir ios_configurations"
  - id: run_ipv6
    title: "Part 4 Step 4c: запуск плейбука настройки IPv6"
    cmd: "ansible-playbook -v cisco_router_ipv6_config_playbook.yaml"
    timeout: 300
  - id: cat_ipv6_output
    title: "Part 4 Step 5: результат show ipv6 interface brief"
    cmd: "cat ios_configurations/IPv6_output_CSR1kv.txt"
  - id: run_ipv6_again
    title: "Повторный запуск: идемпотентность ios_config"
    cmd: "ansible-playbook cisco_router_ipv6_config_playbook.yaml"
    timeout: 300
  - id: backup_after
    title: "Резервная копия после изменения конфигурации"
    cmd: "ansible-playbook backup_cisco_router_playbook.yaml && grep -n -A8 '^interface GigabitEthernet1' backups/show_run_CSR1kv.txt"
    timeout: 300

  # ---------- Дополнительно: пароль в Ansible Vault ----------
  - id: vault_pass_file
    title: "Vault: файл с паролем хранилища"
    cmd: "openssl rand -base64 24 > ~/.vault_pass && chmod 600 ~/.vault_pass && ls -l ~/.vault_pass"
  - id: vault_encrypt
    title: "Vault: шифрование пароля устройства"
    cmd: "mkdir -p host_vars && ansible-vault encrypt_string --vault-password-file ~/.vault_pass 'cisco123!' --name ansible_password > host_vars/CSR1kv.yml"
  - id: hosts_no_password
    title: "Vault: inventory без пароля"
    write_file:
      path: ~/labs/devnet-src/ansible/ansible-csr1000v/hosts
      content: |
        # Enter the hosts or devices for Ansible playbooks
        # Пароль перенесён в host_vars/CSR1kv.yml (зашифрован Ansible Vault)
        CSR1kv ansible_user=cisco ansible_host=192.168.56.101
  - id: vault_show
    title: "Vault: содержимое hosts и host_vars/CSR1kv.yml"
    cmd: "cat hosts host_vars/CSR1kv.yml"
  - id: vault_run_nopass
    title: "Vault: запуск без пароля хранилища"
    cmd: "ansible-playbook backup_cisco_router_playbook.yaml"
    timeout: 300
  - id: vault_run_ok
    title: "Vault: запуск с паролем хранилища"
    cmd: "ansible-playbook --vault-password-file ~/.vault_pass backup_cisco_router_playbook.yaml"
    timeout: 300
