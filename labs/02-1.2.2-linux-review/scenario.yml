# Среда: env vm (Ubuntu 24.04 с systemd): нужна для shutdown +1 / shutdown -c и полного списка
# процессов в ps -e. Причины и все отличия от методички — в NOTES.md.
lab: "1.2.2"
title: "Linux Review"
shell_init:
  # umask и локаль пользователя devasc в ВМ DEVASC (файлы -rw-rw-r--, порядок ls, формат date)
  - "umask 0002"
  - "if locale -a 2>/dev/null | grep -qix 'en_US.utf8'; then export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8; fi"
  # man показывает страницу через more: less рисует экран позиционированием курсора
  - "export MANPAGER=more"
collect:
  - ~/Documents
  - ~/Desktop
  - ~/linux.txt
  - ~/linux2.txt
  - ~/linux3.txt
steps:
  # ---------- Part 1: Launch the DEVASC VM / Part 2 Step 1: Open a terminal ----------
  - id: env
    title: "Part 2 Step 1: терминал стенда (ОС, имя хоста, пользователь)"
    cmd: "head -n 4 /etc/os-release && hostname && whoami"

  # ---------- Part 2: Review Command Syntax Navigation ----------
  - id: ls
    title: "Part 2 Step 2a: содержимое домашнего каталога"
    cmd: "ls"
  - id: ls_labs
    title: "Part 2 Step 2b: содержимое каталога labs"
    cmd: "ls labs"
  - id: ls_l
    title: "Part 2 Step 2c: длинный формат ls -l"
    cmd: "ls -l"
  - id: ls_r
    title: "Part 2 Step 2d: обратный порядок ls -r"
    cmd: "ls -r"
  - id: ls_lr
    title: "Part 2 Step 2e: комбинация ключей ls -lr"
    cmd: "ls -lr"
  - id: man_ls
    title: "Part 2 Step 2f: справочная страница man ls (пробел - следующая страница, q - выход)"
    cmd: "man ls"
    timeout: 120
    interact:
      - expect: "--More--"
        timeout: 60
        delay: 0.5
        send: " "
        raw: true
      - expect: "--More--"
        timeout: 30
        optional: true
        delay: 0.5
        send: "q"
        raw: true
  - id: ls_help
    title: "Part 2 Step 2g: краткая справка ls --help"
    cmd: "ls --help"
  - id: pwd
    title: "Part 2 Step 2h: текущий каталог"
    cmd: "pwd"
  - id: cd_documents
    title: "Part 2 Step 2i: переход в Documents"
    cmd: "cd Documents"
  - id: cd_root
    title: "Part 2 Step 2j: переход в корневой каталог"
    cmd: "cd /"
  - id: pwd_root
    title: "Part 2 Step 2j: проверка текущего каталога"
    cmd: "pwd"
  - id: cd_documents_abs
    title: "Part 2 Step 2k: возврат в /home/devasc/Documents по полному пути"
    cmd: "cd /home/devasc/Documents/"
  - id: cd_up
    title: "Part 2 Step 2l: на уровень выше"
    cmd: "cd .."
  - id: pwd_home
    title: "Part 2 Step 2l: проверка текущего каталога"
    cmd: "pwd"
  - id: apt_update
    title: "Part 2 Step 3a: обновление списков пакетов через sudo"
    cmd: "sudo apt-get update"
    timeout: 600

  # ---------- Part 3: Review File Management ----------
  - id: ls_desktop
    title: "Part 3 Step 1a: права доступа файлов рабочего стола"
    cmd: "ls Desktop -l"
  - id: cd_documents2
    title: "Part 3 Step 2a: переход в Documents"
    cmd: "cd Documents/"
  - id: echo_script
    title: "Part 3 Step 2b: однострочный скрипт myfile.sh через echo и >"
    cmd: 'echo "ls ../Desktop" > myfile.sh'
  - id: cat_script
    title: "Part 3 Step 2c: содержимое myfile.sh"
    cmd: "cat myfile.sh"
  - id: run_denied
    title: "Part 3 Step 2d: запуск без права на выполнение"
    cmd: "./myfile.sh"
    expect_exit: 126
  - id: ls_l_script
    title: "Part 3 Step 2e: права myfile.sh"
    cmd: "ls -l myfile.sh"
  - id: chmod_x
    title: "Part 3 Step 2f: добавление права на выполнение"
    cmd: "chmod +x myfile.sh"
  - id: run_script
    title: "Part 3 Step 2g: запуск скрипта"
    cmd: "./myfile.sh"
  - id: chown_root
    title: "Part 3 Step 2h: владелец файла - root"
    cmd: "sudo chown root myfile.sh"
  - id: ls_l_owner
    title: "Part 3 Step 2i: права и владелец после chown"
    cmd: "ls -l"
  - id: mv_to_desktop
    title: "Part 3 Step 3a: перемещение myfile.sh на рабочий стол"
    cmd: "mv myfile.sh /home/devasc/Desktop/"
  - id: ls_desktop2
    title: "Part 3 Step 3b: содержимое Desktop"
    cmd: "ls ../Desktop/"
  - id: mv_back
    title: "Part 3 Step 3c: возврат файла в Documents"
    cmd: "mv ../Desktop/myfile.sh myfile.sh"
  - id: mv_rename
    title: "Part 3 Step 3d: переименование в myfile_renamed.sh"
    cmd: "mv myfile.sh myfile_renamed.sh"
  - id: ls_renamed
    title: "Part 3 Step 3d: проверка"
    cmd: "ls"
  - id: cp_copy
    title: "Part 3 Step 4a: копирование файла"
    cmd: "cp myfile_renamed.sh myfile_renamed_and_copied.sh"
  - id: ls_copied
    title: "Part 3 Step 4a: проверка"
    cmd: "ls"
  - id: rm_copy
    title: "Part 3 Step 5: удаление копии"
    cmd: "rm myfile_renamed_and_copied.sh"
  - id: ls_removed
    title: "Part 3 Step 5: проверка"
    cmd: "ls"
  - id: cd_home
    title: "Part 3 Step 6 (доп.): возврат в домашний каталог, как в приглашениях методички"
    cmd: "cd ~"
  - id: echo_linux
    title: "Part 3 Step 6a: вывод в новый файл linux.txt (>)"
    cmd: 'echo "Linux is AWESOME!" > linux.txt'
  - id: cat_redirect
    title: "Part 3 Step 6b: копирование содержимого через cat и >"
    cmd: "cat linux.txt > linux2.txt"
  - id: cat_linux2
    title: "Part 3 Step 6c: содержимое linux2.txt"
    cmd: "cat linux2.txt"
  - id: echo_append
    title: "Part 3 Step 6d: дописывание строки (>>)"
    cmd: 'echo "I LOVE Linux!" >> linux2.txt'
  - id: cat_linux2_again
    title: "Part 3 Step 6e: содержимое linux2.txt после >>"
    cmd: "cat linux2.txt"
  - id: echo_overwrite
    title: "Part 3 Step 6f: перезапись файла (>)"
    cmd: 'echo "Linux is POWERFUL!" > linux.txt'
  - id: cat_linux
    title: "Part 3 Step 6g: содержимое linux.txt после перезаписи"
    cmd: "cat linux.txt"
  - id: vi_linux3
    title: "Part 3 Step 7a-c: vi linux2.txt, правка, :w linux3.txt, :q (файл задан шагом write_file)"
    write_file:
      path: ~/linux3.txt
      content: |
        Linux is Linux
        I am AWESOME!
  - id: cat_linux3
    title: "Part 3 Step 7d: содержимое linux3.txt"
    cmd: "cat linux3.txt"

  # ---------- Part 4: Review Regular Expressions ----------
  - id: grep_devasc
    title: "Part 4 Step a: строка пользователя devasc"
    cmd: "grep devasc /etc/passwd"
  - id: grep_root
    title: "Part 4 Step b: все вхождения root"
    cmd: "grep root /etc/passwd"
  - id: grep_root_anchor
    title: "Part 4 Step c: root в начале строки (^)"
    cmd: "grep '^root' /etc/passwd"
  - id: grep_false_end
    title: "Part 4 Step d: строки, оканчивающиеся на false ($)"
    cmd: "grep 'false$' /etc/passwd"
  - id: grep_dot
    title: "Part 4 Step e: любой символ (.) в шаблоне d..m"
    cmd: "grep 'd..m' /etc/passwd"
  - id: grep_range
    title: "Part 4 Step f: диапазон символов [8-9]"
    cmd: "grep '[8-9]' /etc/passwd"
  - id: grep_comma
    title: "Part 4 Step g: символ в скобках [,]"
    cmd: "grep '[,]' /etc/passwd"
  - id: grep_star
    title: "Part 4 Step h: повторение предыдущего символа (*)"
    cmd: "grep 'new*' /etc/passwd"

  # ---------- Part 5: Review System Administration ----------
  # Part 5 Step 1a (shutdown now) не выполняется: методичка разрешает пропустить, а раннер выключился бы.
  - id: date
    title: "Part 5 Step 1b: дата и время в ОС"
    cmd: "date"
  - id: shutdown_schedule
    title: "Part 5 Step 1c: выключение через 1 минуту с сообщением"
    cmd: 'sudo shutdown +1 "Come back soon!"'
    timeout: 60
  - id: shutdown_cancel
    title: "Part 5 Step 1c: отмена запланированного выключения"
    cmd: "sudo shutdown -c"
    timeout: 60
  - id: shutdown_guard
    title: "Part 5 Step 1c (служебно): гарантированная отмена выключения раннера"
    host: "timeout 20 shutdown -c >/dev/null 2>&1 || true; test ! -e /run/systemd/shutdown/scheduled"
    timeout: 90
  - id: ip_address
    title: "Part 5 Step 2a: сетевые интерфейсы и адреса"
    cmd: "ip address"
  - id: ping_lan
    title: "Part 5 Step 2b: ping устройства локальной сети"
    cmd: "ping -c 4 192.168.1.1"
    timeout: 60
  - id: ping_cisco
    title: "Part 5 Step 2c: ping по имени узла www.cisco.com"
    cmd: "ping -c 4 www.cisco.com"
    timeout: 90
  - id: ps
    title: "Part 5 Step 3a: процессы текущего терминала"
    cmd: "ps"
  - id: ps_e
    title: "Part 5 Step 3b: все процессы системы"
    cmd: "ps -e"
  - id: ps_e_more
    title: "Part 5 Step 3c: постраничный вывод | more (Enter - строка, пробел - экран, q - выход)"
    cmd: "ps -e | more"
    timeout: 120
    interact:
      - expect: "--More--"
        timeout: 30
        delay: 0.5
        send: "\r"
        raw: true
      - expect: "--More--"
        timeout: 15
        optional: true
        delay: 0.5
        send: " "
        raw: true
      # Выход клавишей q: more из util-linux 2.39 (Ubuntu 24.04) не реагирует на Ctrl+C
      # в режиме приглашения --More-- при записи через псевдотерминал (проверено в CI).
      - expect: "--More--"
        timeout: 15
        optional: true
        delay: 0.5
        send: "q"
        raw: true
  - id: ps_ef
    title: "Part 5 Step 3d: все процессы в полном формате"
    cmd: "ps -ef"
  - id: apt_update2
    title: "Part 5 Step 4a: обновление списков пакетов"
    cmd: "sudo apt-get update"
    timeout: 600
  - id: apt_search
    title: "Part 5 Step 4b: поиск пакета apt-cache search"
    cmd: "apt-cache search speed test"
    timeout: 120
  - id: apt_install
    title: "Part 5 Step 4c: установка speedtest-cli"
    cmd: "sudo apt-get install speedtest-cli"
    timeout: 600
    interact:
      - expect: "Do you want to continue\\? \\[Y/n\\]"
        timeout: 45
        optional: true
        send: "Y"
  - id: speedtest
    title: "Part 5 Step 4d: измерение скорости подключения к интернету"
    cmd: "speedtest-cli"
    timeout: 300
  - id: apt_upgrade
    title: "Part 5 Step 4e: обновление установленных пакетов"
    cmd: "sudo apt-get upgrade"
    timeout: 1800
    interact:
      - expect: "Do you want to continue\\? \\[Y/n\\]"
        timeout: 90
        optional: true
        send: "Y"
  - id: apt_purge
    title: "Part 5 Step 4f: полное удаление пакета (purge)"
    cmd: "sudo apt-get purge speedtest-cli"
    timeout: 300
    interact:
      - expect: "Do you want to continue\\? \\[Y/n\\]"
        timeout: 45
        optional: true
        send: "Y"
  - id: passwd
    title: "Part 5 Step 5a: смена пароля пользователя devasc"
    cmd: "passwd"
    timeout: 60
    interact:
      - expect: "[Cc]urrent[^:]*[Pp]assword:"
        timeout: 20
        send: "Cisco123!"
      - expect: "New password:"
        timeout: 20
        send: "Tq7#vLm2Rx"
      - expect: "Retype new password:"
        timeout: 20
        send: "Tq7#vLm2Rx"
  - id: passwd_status
    title: "Part 5 Step 5b: состояние пароля passwd -S"
    cmd: "passwd -S"
  - id: man_passwd
    title: "Part 5 Step 5c: справочная страница man passwd"
    cmd: "man passwd"
    timeout: 120
    interact:
      - expect: "--More--"
        timeout: 60
        delay: 0.5
        send: "q"
        raw: true
  - id: man_passwd_status
    title: "Part 5 Step 5c (доп.): описание ключа -S в man passwd"
    cmd: "man passwd | grep -B 1 -A 6 'Display account status'"
